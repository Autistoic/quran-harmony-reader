<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Quran Reader</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      // Converts path and query to query parameter so index.html can restore it.
      var pathSegmentsToKeep = window.location.hostname.endsWith('github.io') ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
